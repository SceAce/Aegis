[project]
name = "aegis"
version = "0.1.0"
description = "Aegis demo: Pi plugin + memory loop for six CTF challenges"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
